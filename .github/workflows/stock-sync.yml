name: Stock Data Sync

on:
  schedule:
    # Run every 5 minutes for testing (as requested by user)
    - cron: '*/5 * * * *'
    # To run daily at 17:00 VN time (10:00 UTC) Monday-Friday, uncomment below:
    # - cron: '0 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    name: Trigger Stock Sync API
    runs-on: ubuntu-latest
    steps:
      - name: Send POST Request to Sync API
        run: |
          echo "Triggering Stock Sync API..."
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail-with-body \
            "${{ secrets.STOCK_SYNC_API_URL }}"
